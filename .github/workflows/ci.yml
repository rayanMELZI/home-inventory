name: CI

on:
  push:
    branches: [main]
  pull_request:

# Never let two pipeline runs (and especially two deploys) overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Run tests
        run: ./mvnw verify -B

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Not `npm install`: ci fails loudly if the lockfile and package.json
      # disagree, which is exactly the breakage a Windows-generated lockfile
      # causes and which must not reach the image build.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Always builds both images; only pushes them from main.
  #
  # Building on pull requests costs a few minutes and buys the one thing unit
  # tests cannot catch: a Dockerfile or a lockfile that is fine on a laptop and
  # broken in a container. A CRLF line ending on backend/mvnw once took the
  # image build down with a bare "exit code 127" — with this job, that shows up
  # on the PR instead of halfway through a deploy.
  images:
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: homestock-backend
            context: backend
          - name: homestock-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # After the images are published: render config from GitHub secrets, ship it
  # to the VM, and restart the stack on the exact build published above.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # cloudflared reads these to authenticate through Cloudflare Access.
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # Cheap, and it turns the worst failure mode — a deploy that "succeeds"
      # onto a backend that then refuses to start because JWT_SECRET is empty —
      # into one line naming the missing secret.
      - name: Check the required secrets are actually set
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          missing=""
          for name in POSTGRES_PASSWORD JWT_SECRET DEPLOY_HOST DEPLOY_USER DEPLOY_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see deploy/README.md"
            exit 1
          fi

      # Secrets are bound to env vars rather than pasted into the script text.
      # Interpolating them directly would run anything a value happened to
      # contain, and would mangle a password with a backtick or a newline in it.
      - name: Render .env from repository secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECURE_COOKIES: ${{ vars.SECURE_COOKIES || 'true' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          BACKUP_KEEP_DAYS: ${{ vars.BACKUP_KEEP_DAYS || '14' }}
        run: |
          cp deploy/compose.prod.yml compose.prod.yml
          {
            printf 'IMAGE_OWNER=%s\n' "${GITHUB_REPOSITORY_OWNER,,}"
            printf 'IMAGE_TAG=sha-%s\n' "${GITHUB_SHA::7}"
            printf 'POSTGRES_DB=%s\n' "homestock"
            printf 'POSTGRES_USER=%s\n' "homestock"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'SECURE_COOKIES=%s\n' "$SECURE_COOKIES"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"
            printf 'BACKUP_KEEP_DAYS=%s\n' "$BACKUP_KEEP_DAYS"
          } > .env
          echo "Deploying sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH through the Cloudflare tunnel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host vm"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
          } > ~/.ssh/config

      # The backups directory has to exist before compose bind-mounts it, and
      # /opt/homestock has to exist before scp will write into it.
      #- name: Make sure the app directory exists
      #  run: ssh vm 'mkdir -p /opt/homestock/backups'

      - name: Copy compose file and .env to the VM
        run: scp compose.prod.yml .env vm:/opt/homestock/

      - name: Pull the new images and restart the stack
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh vm "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'EOF'
          set -e
          cd /opt/homestock
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          EOF

      # compose waits for the backend to report healthy, but "healthy" only
      # means the actuator answered. This checks the chain the user actually
      # uses: the browser hits the frontend, the frontend proxies to the
      # backend. A 401 from /api/users/me is the right answer — it proves the
      # request reached Spring Security. A 502 means the proxy found nothing.
      - name: Check the deployed app answers
        run: |
          ssh vm 'bash -s' <<'EOF'
          set -e
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:3005/login; then break; fi
            [ "$attempt" -eq 20 ] && { echo "frontend never came up"; exit 1; }
            sleep 3
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3005/api/users/me)
          if [ "$code" != "401" ]; then
            echo "the frontend cannot reach the backend (got $code, expected 401)"
            cd /opt/homestock && docker compose -f compose.prod.yml ps
            exit 1
          fi
          echo "frontend is serving and reaching the backend"
          EOF
