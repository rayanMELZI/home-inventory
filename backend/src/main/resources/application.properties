spring.application.name=homestock-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homestock}
spring.datasource.username=${DB_USER:homestock}
spring.datasource.password=${DB_PASSWORD:homestock}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutes=15
app.refresh.ttl-days=7
app.secure-cookies=${SECURE_COOKIES:false}

# Meal suggestions. Blank key disables the feature; everything else still works.
# Key: https://aistudio.google.com/apikey (the free tier is plenty for this).
app.meals.api-key=${GEMINI_API_KEY:}
# The "-latest" alias tracks the current flash model, so a pinned name going
# new-user-gated (as gemini-2.5-flash once did) cannot silently break this.
app.meals.model=${GEMINI_MODEL:gemini-flash-latest}
app.meals.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
