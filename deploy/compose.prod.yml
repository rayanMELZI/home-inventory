name: homestock

# Production stack for the VM: pulls prebuilt images from GHCR.
#   docker compose -f compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER}/homestock-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/homestock-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      # localhost-only: reachable through the Cloudflare tunnel, not the network
      - "3005:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
