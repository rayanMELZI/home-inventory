name: homestock

# Production stack for the VM: pulls prebuilt images from GHCR.
#   docker compose -f compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER}/homestock-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/homestock-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      # localhost-only: reachable through the Cloudflare tunnel, not the network
      - "3005:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Actually runs, unlike the cron fromNowToSuccess only ever documented.
  # Nothing here is encrypted, so these dumps restore with no key.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Dump to a temporary name first: a crash mid-write must not leave a
          # truncated file sitting there looking like a good backup.
          stamp=$$(date +%F)
          if pg_dump --clean --if-exists | gzip > "/backups/.partial.sql.gz"; then
            mv "/backups/.partial.sql.gz" "/backups/homestock-$$stamp.sql.gz"
            echo "[backup] wrote homestock-$$stamp.sql.gz"
          else
            rm -f "/backups/.partial.sql.gz"
            echo "[backup] FAILED at $$(date -Iseconds)" >&2
          fi
          find /backups -name 'homestock-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  db-data:
